name: Check site build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Inspect rendered pages
        run: |
          python3 - <<'PY'
          import re, pathlib
          about = pathlib.Path("_site/index.html").read_text()
          pubs = pathlib.Path("_site/publications/index.html").read_text()
          hyperplane = pathlib.Path("_site/publication/universal-truthfulness-hyperplane/index.html").read_text()
          print("ABOUT SECTIONS:", re.findall(r"<h2[^>]*>(.*?)</h2>", about, re.S))
          start = about.find("Research Interests")
          print("ABOUT EXCERPT:", about[max(0, start - 200):start + 700])
          start = about.find("author__content")
          print("SIDEBAR:", about[start:start + 1800])
          print("PUBLICATION YEARS:", re.findall(r"<h2>(.*?)</h2>", pubs))
          print("PUBLICATION META:", re.findall(r"<p>Published in.*?</p>", pubs, re.S))
          print("DETAIL PAGE META:", re.findall(r"<p>Published in.*?</p>", hyperplane, re.S))
          print("INTERNAL LINKS:", sorted(set(re.findall(r'href="(https://spanellisnikolaos564-maker.github.io/LJT-Homepage[^"]*)"', about))))
          PY
