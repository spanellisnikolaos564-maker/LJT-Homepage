name: Check site build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Inspect generated pages
        run: |
          find _site -maxdepth 2 -name '*.html' | sort
          python3 - <<'PY'
          import re, pathlib
          titles = [
              "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond",
              "On the Perception Bottleneck of VLMs for Chart Understanding",
              "On the Universal Truthfulness Hyperplane Inside LLMs",
              "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation",
              "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models",
              "Composing Parameter-Efficient Modules with Arithmetic Operations",
          ]
          about = pathlib.Path("_site/index.html").read_text()
          pubs = pathlib.Path("_site/publications/index.html").read_text()
          for label, html in (("about", about), ("publications", pubs)):
              text = re.sub(r"<[^>]+>", " ", html)
              text = re.sub(r"\s+", " ", text)
              missing = [t for t in titles if t not in text]
              print(f"{label}: missing titles = {missing}")
              assert not missing, f"{label} is missing publications"
          for label, html in (("about", about), ("publications", pubs)):
              for fragment in ["jliugi@connect.ust.hk", "github.com/Vicent0205", "tbK9jl4AAAAJ", "junteng88716710", "Zhiyuan Honor Scholarship", "MINIMAX", "Tencent WXG", "Shanghai AI Lab", "Junxian He", "Zifei Shan", "Yu Cheng"]:
                  if label == "publications" and fragment not in ["jliugi@connect.ust.hk", "github.com/Vicent0205", "tbK9jl4AAAAJ", "junteng88716710"]:
                      continue
                  assert fragment in html, f"{label} missing {fragment}"
              print(f"{label}: profile details present")
          for leftover in ["Your Name", "Paper Title Number", "Red Brick University", "Blog Posts", "GitHub Journal of Bugs"]:
              assert leftover not in about + pubs, f"Template leftover found: {leftover}"
          print("About page heading levels:", re.findall(r"<h2[^>]*>(.*?)</h2>", about))
          print("Publication years:", re.findall(r"<h2>(.*?)</h2>", pubs))
          print("Publication entries:", len(re.findall(r"archive__item-title", pubs)))
          print("All content checks passed.")
          PY
