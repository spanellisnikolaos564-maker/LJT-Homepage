name: Enable GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages (source: master branch, root)
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"master","path":"/"}}')
          echo "GitHub Pages enable response status: $RESPONSE"
          if [ "$RESPONSE" = "201" ]; then
            echo "GitHub Pages has been enabled."
          elif [ "$RESPONSE" = "409" ]; then
            echo "GitHub Pages is already enabled."
          else
            echo "Could not enable GitHub Pages automatically (status $RESPONSE)."
            echo "You can enable it manually in the repository Settings -> Pages."
          fi
